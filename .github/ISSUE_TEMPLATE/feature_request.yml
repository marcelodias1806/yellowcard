name: Feature request
description: Suggest a defensive, passive YellowCard improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        YellowCard accepts defensive and educational ideas. Requests for packet
        injection, deauthentication, credential capture, unauthorized
        association, active BLE access, spoofing, or persistent tracking are
        outside project scope. Never include secrets or private infrastructure.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the user need without prescribing an implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful solution and expected UI flow.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Badge or Contacts UI
        - Wi-Fi connectivity
        - Passive Wi-Fi visualization
        - Passive BLE visualization
        - Display or touch
        - Build or documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: resources
    attributes:
      label: Resource and hardware impact
      description: Note expected RAM, flash, radio, power, or board-compatibility impact.

  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Explain data collected, retained, displayed, or transmitted.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not add offensive or unauthorized RF behavior.
          required: true
        - label: This request does not require publishing credentials or private infrastructure.
          required: true
        - label: I understand that physical validation may be required.
          required: true
